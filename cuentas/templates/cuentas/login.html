<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ingresar · Damol Digital</title>
{% load static %}
<style>
  * { box-sizing: border-box; }
  body {
    font-family: system-ui, -apple-system, sans-serif; margin: 0; min-height: 100vh;
    display: flex; align-items: center; justify-content: center; background: #1a1a1a;
  }
  .tarjeta-login {
    background: #fff; border-radius: 12px; padding: 2.2rem 2rem; width: 100%; max-width: 22rem;
    box-shadow: 0 10px 40px rgba(0,0,0,.3);
  }
  .tarjeta-login img { display: block; margin: 0 auto 1.5rem auto; max-width: 12rem; }
  h1 { font-size: 1.1rem; text-align: center; color: #1a1a1a; margin: 0 0 1.3rem 0; }
  label { display: block; font-weight: 600; margin-top: .9rem; margin-bottom: .3rem; font-size: .85rem; color: #212529; }
  input[type=text], input[type=password] {
    width: 100%; padding: .6rem .7rem; font-size: .9rem; border: 1px solid #d5d8dc; border-radius: 6px;
  }
  button {
    width: 100%; margin-top: 1.3rem; background: #FF9900; color: #1a1a1a; border: none;
    padding: .7rem 1rem; font-size: .95rem; font-weight: 700; border-radius: 6px; cursor: pointer;
  }
  button:hover { filter: brightness(.95); }
  .errorlist { color: #CC0000; font-size: .85rem; list-style: none; padding: 0; margin: .8rem 0 0 0; }
</style>
</head>
<body>
  <div class="tarjeta-login">
    <img src="{% static 'reportes/damol_logo.jpg' %}" alt="Damol Ingenieros">
    <h1>Ingresar a Damol Digital</h1>
    <form method="post">
      {% csrf_token %}
      {{ form.non_field_errors }}
      <label for="{{ form.username.id_for_label }}">Usuario</label>
      {{ form.username }}
      <label for="{{ form.password.id_for_label }}">Contraseña</label>
      {{ form.password }}
      <button type="submit">Ingresar</button>
    </form>
  </div>
</body>
</html>
